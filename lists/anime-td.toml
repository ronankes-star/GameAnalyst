# The anime tower-defense list. `python -m gameanalyst list` shows what these rules decide, with the reasons.
#
# How a game gets its verdict:
# - in:    Roblox files it under Tower Defense, it shows the anime theme, and it shows no other theme.
# - check: the signs disagree (anime and another theme, only one weak sign, or TD words in the name of a game that
#          Roblox files under another genre). A person decides.
# - out:   not Tower Defense, another theme, or no anime words at all.
# Words match whole words in the name and the description, in any case. Your decisions at the bottom win over them.

name = "anime-td"
title = "Anime tower defense"

[genre]
genre_l2 = ["Tower Defense"]
# Name words that show a TD game when Roblox files it under another genre. Such a game goes to "check" when it
# also shows the anime theme.
name_words = ["tower defense", "tower defence", "td", "defense", "defence", "defender", "defenders"]

[theme]
# General anime words. In the name, one is enough. In the description alone, one is a weak sign and two are enough.
words = [
  "anime", "animes", "アニメ", "manga", "waifu", "waifus", "husbando", "otaku", "senpai", "kawaii", "chibi",
  "shonen", "shounen", "isekai",
]
