# What the daily run looks for, next to the Charts page.
# A game stays tracked once it is found, so this list only has to grow.

[search]
pages = 3  # pages per term, about 40 games per page. Pages 1-3 hold a term's best matches.
queries = [
  # anime tower defense
  "anime tower defense", "anime td", "tower defense anime", "anime defense", "anime defenders",
  "anime tower defense simulator",
  # every tower defense: the comparison group, and the anime TDs whose names have no anime word
  "tower defense", "td",
  # franchises and known anime TD titles
  "one piece tower defense", "naruto tower defense", "dragon ball tower defense", "jujutsu tower defense",
  "demon slayer tower defense", "bleach tower defense", "solo leveling tower defense", "chainsaw man tower defense",
  "hunter x hunter tower defense", "one punch man tower defense", "black clover tower defense",
  "waifu tower defense", "all star tower defense", "ultimate tower defense", "universal tower defense",
  # Every genre (M2b). The charts show each genre's leaders; these terms also find its small and quiet games.
  # Checked 2026-11-12: 3 pages of these 56 terms found 3,852 games that were not tracked yet.
  "battlegrounds", "fighting game", "open world", "rhythm game",  # Action
  "adventure", "story game", "exploration",  # Adventure
  "obby", "tower obby", "parkour", "runner",  # Obby & Platformer
  "minigames", "quiz", "party game", "drawing game",  # Party & Casual
  "puzzle", "escape room", "merge game",  # Puzzle
  "rpg", "dungeon", "open world rpg",  # RPG
  "roleplay", "life roleplay", "dress up", "pet game", "animal simulator",  # Roleplay & Avatar Sim
  "shooter", "fps", "battle royale", "gun game",  # Shooter
  "avatar shop", "ugc",  # Shopping
  "simulator", "tycoon", "idle", "incremental", "car game", "driving", "sandbox", "rng", "brainrot",
  "garden",  # Simulation
  "soccer", "football", "basketball", "racing",  # Sports & Racing
  "strategy", "card game",  # Strategy (tower defense is above)
  "survival", "horror", "escape", "1 vs all", "hide and seek",  # Survival
  "hangout", "music", "showcase",  # Entertainment & Social
]

[search.more_pages]
# Terms that still found new TD games 15 pages deep (checked 2026-11-12). Every third page held most of them.
# "tower defense" goes deepest: its deep pages feed the tower-defense list, the comparison group.
"anime tower defense" = 15
"tower defense" = 30
"anime td" = 15
"td" = 10

[places]
# Ronan's own games (place ids). The run turns them into universe ids.
own = [
  113058702384643,  # Superhero TD
  126148013191356,  # Romance TD
  87883827884201,   # My Zombie Restaurant
  104237525424904,  # A Weird Boba Cafe
  120692744191823,  # Hollowborn
  73465103908325,   # EPISODE
  137470815868209,  # Roll a Player TD (Avatar TD)
  76472318687002,   # Slingshot Duels
]
